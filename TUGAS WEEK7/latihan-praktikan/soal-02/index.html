<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrasi Peserta React</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; line-height: 1.5; color: #1f2937; }
    section { border: 1px solid #d1d5db; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 8px 0 4px; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; font: inherit; }
    button { padding: 8px 14px; margin-top: 10px; margin-right: 8px; cursor: pointer; font: inherit; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    .loading { color: #b45309; } .error { color: #b91c1c; } .ok { color: #047857; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
    dt { font-weight: 600; } dd { margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="../../vendor/react.development.js"></script>
  <script src="../../vendor/react-dom.development.js"></script>
  <script src="../../vendor/axios.min.js"></script>
  <script src="../../vendor/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
