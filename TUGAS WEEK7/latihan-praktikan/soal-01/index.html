<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Informasi Praktikum</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; line-height: 1.5; color: #1f2937; }
    section { border: 1px solid #d1d5db; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; margin-top: 0; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    textarea, select { width: 100%; padding: 8px; box-sizing: border-box; font: inherit; }
    button { padding: 8px 14px; margin-top: 8px; cursor: pointer; font: inherit; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    pre { background: #f3f4f6; padding: 12px; border-radius: 6px; white-space: pre-wrap; min-height: 3em; }
    .status { margin: 8px 0; font-weight: 600; }
    .loading { color: #b45309; } .error { color: #b91c1c; } .ok { color: #047857; }
    ul { padding-left: 20px; }
  </style>
</head>
<body>
  <h1>Portal Informasi Praktikum</h1>

  <section aria-labelledby="judul-interaksi">
    <h2 id="judul-interaksi">Catatan dan hitungan</h2>
    <label for="catatan">Catatan praktikan</label>
    <textarea id="catatan" rows="3" placeholder="Ketik catatan di sini..."></textarea>
    <p>Hitungan: <strong id="hitungan">0</strong></p>
    <button type="button" id="btn-hitung">Tambah hitungan</button>
    <p>Halaman pertama dibuka: <span id="waktu-awal"></span></p>
  </section>

  <section aria-labelledby="judul-pengumuman">
    <h2 id="judul-pengumuman">Pengumuman (XMLHttpRequest)</h2>
    <button type="button" id="btn-pengumuman">Muat pengumuman</button>
    <div id="status-pengumuman" class="status" role="status" aria-live="polite"></div>
    <pre id="isi-pengumuman"></pre>
  </section>

  <section aria-labelledby="judul-direktori">
    <h2 id="judul-direktori">Direktori peserta (Fetch)</h2>
    <label for="sumber">Sumber data</label>
    <select id="sumber">
      <option value="mock">Mock lokal</option>
      <option value="eksternal">JSONPlaceholder</option>
    </select>
    <button type="button" id="btn-peserta">Ambil peserta</button>
    <div id="status-peserta" class="status" role="status" aria-live="polite"></div>
    <p id="info-peserta"></p>
    <ul id="daftar-peserta"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
